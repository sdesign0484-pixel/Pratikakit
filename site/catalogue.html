<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0d13">
<meta name="description" content="Tous les outils et applications, par catégorie.">
<title>Catalogue</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script defer src="js/vendor/supabase.js"></script>
<script type="module" src="js/pages/catalogue.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Aller au contenu</a>
<div id="site-header"></div>
<main id="main">
  <noscript><div class="container"><p class="alert alert-info">Ce site a besoin de JavaScript pour afficher le catalogue.</p></div></noscript>
  <div class="container">
    <div class="page-head">
      <h1>Catalogue</h1>
      <p>Tous les outils, classés par catégorie. Cherchez par nom ou par besoin.</p>
    </div>
    <div class="filters">
      <form class="search-box" id="search-form" role="search">
        <label class="visually-hidden" for="search">Rechercher un outil</label>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="search" type="search" placeholder="Rechercher un outil, un besoin…" autocomplete="off">
      </form>
      <div class="chips" id="chips" role="group" aria-label="Filtrer par catégorie"></div>
    </div>
    <p class="result-count" id="result-count" aria-live="polite"></p>
    <div id="grid"></div>
  </div>
</main>
<div id="site-footer"></div>
</body>
</html>
